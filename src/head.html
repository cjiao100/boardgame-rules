<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>俊伟的桌游规则手册</title>
<style>
:root{--bg:#fdfcf8;--fg:#1f2328;--mut:#5b6470;--card:#fff;--line:#e3e0d6;--acc:#b5482a;--acc2:#2f6f8f;--hi:#fff4d6;--warn:#fff0f0;--nav:#24313d}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--fg:#e6e6e6;--mut:#9aa4af;--card:#1d2127;--line:#323842;--acc:#f08a6c;--acc2:#7cc0e0;--hi:#3a3220;--warn:#3a2224;--nav:#0d1117}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-text-size-adjust:100%}
nav.top{position:sticky;top:0;z-index:10;background:var(--nav);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;box-shadow:0 2px 6px rgba(0,0,0,.2)}
nav.top a{display:inline-block;color:#fff;text-decoration:none;padding:12px 12px;font-size:15px}
nav.top a:active,nav.top a:hover{background:rgba(255,255,255,.15)}
main{max-width:860px;margin:0 auto;padding:12px 14px 60px}
h1{font-size:1.55em;margin:.6em 0 .2em}
h2{font-size:1.35em;margin:1.8em 0 .4em;padding:.35em .6em;border-left:6px solid var(--acc);background:var(--card);border-radius:4px}
h3{font-size:1.12em;margin:1.4em 0 .4em;color:var(--acc2);border-bottom:1px solid var(--line);padding-bottom:.2em}
h4{font-size:1em;margin:1em 0 .3em}
.game{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 14px 14px;margin:18px 0}
.game>h2{margin-top:14px;border-left-width:8px}
.meta{color:var(--mut);font-size:.9em}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.6em 0}
table{border-collapse:collapse;min-width:100%;font-size:.92em}
th,td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
th{background:rgba(127,127,127,.12);white-space:nowrap}
code,.pat{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(127,127,127,.12);padding:0 4px;border-radius:3px;white-space:nowrap}
pre{background:rgba(127,127,127,.12);padding:6px 10px;border-radius:6px;display:inline-block;margin:.3em 0;font-size:1.05em;line-height:1.5}
.hl{background:var(--hi);border:2px solid #d9a400;border-radius:8px;padding:6px 12px;margin:.8em 0}
.warn{background:var(--warn);border-left:4px solid #d04040;padding:6px 12px;border-radius:4px;margin:.8em 0}
.todo{display:inline-block;background:#d04040;color:#fff;border-radius:4px;padding:0 6px;font-size:.85em;margin-left:4px}
.ok{display:inline-block;background:#2e8b57;color:#fff;border-radius:4px;padding:0 6px;font-size:.85em;margin-left:4px}
.part{display:inline-block;background:#c58a00;color:#fff;border-radius:4px;padding:0 6px;font-size:.85em;margin-left:4px}
details.toc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:12px 0}
details.toc summary{font-weight:bold;cursor:pointer;padding:4px 0}
details.toc ul{margin:.2em 0 .6em;padding-left:1.2em}
details.toc li{margin:.15em 0}
a{color:var(--acc2)}
.secnav{font-size:.85em;margin:.2em 0 .6em;line-height:2}
.secnav a{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:0 8px;margin:0 4px 4px 0;text-decoration:none}
.totop{display:block;text-align:right;font-size:.85em;margin-top:8px}
ul,ol{padding-left:1.4em}
li{margin:.15em 0}
footer{color:var(--mut);font-size:.85em;border-top:1px solid var(--line);margin-top:30px;padding-top:10px}

/* Mobile reading and native disclosures. */
:root{color-scheme:light dark}
main{max-width:960px;padding:20px 16px 100px;overflow-wrap:anywhere}
h1{font-size:clamp(1.45rem,5vw,2rem);line-height:1.35;margin:.5em 0}
h2{font-size:1.2rem;line-height:1.55;margin:0;padding:0;border:0;background:none}
h3{font-size:1.05rem;line-height:1.55;margin:0;padding:0;border:0}
h4{font-size:1rem;margin:1.2em 0 .5em}
p{margin:.7em 0}
.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:24px 0}
.game-card{min-width:0;display:flex;flex-direction:column;gap:8px;padding:16px 12px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:12px;text-decoration:none}
.game-card strong{font-size:1.05rem;color:var(--fg)}
.game-card span{font-size:.78rem;line-height:1.6;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.game-card:hover{border-color:var(--acc)}
.game{padding:0;margin:24px 0;border-radius:14px;min-width:0}
summary{cursor:pointer;min-height:48px;padding:14px;list-style:none;position:relative;padding-right:40px}
summary::-webkit-details-marker{display:none}
summary::after{content:'＋';position:absolute;right:14px;top:14px;color:var(--acc2);font-weight:600}
details[open]>summary::after{content:'−'}
summary h2,summary h3{display:inline}
.game-panel>summary{background:var(--hi);border-radius:13px}
.game-panel[open]>summary{border-radius:13px 13px 0 0;border-bottom:1px solid var(--line)}
.game-body{padding:12px}
.chapter{border-top:1px solid var(--line);margin-top:8px;min-width:0}
.chapter>summary{padding-left:0}
.chapter-body{padding:0 0 12px}
.secnav{display:flex;flex-wrap:wrap;gap:6px;line-height:1.5;margin:4px 0 16px}
.secnav a{margin:0;padding:9px 10px;border-radius:8px;max-width:100%}
.tw{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;border-radius:6px}
table{width:100%;min-width:520px;line-height:1.65}
th,td{padding:10px;overflow-wrap:anywhere}
th{white-space:normal}
pre{display:block;max-width:100%;overflow-x:auto}
code,.pat{white-space:normal;overflow-wrap:anywhere}
.badge,.ok,.part,.todo{display:inline-block;vertical-align:baseline;font-size:.75rem;line-height:1.6;font-weight:600;padding:2px 7px;border-radius:6px;margin:0 3px;white-space:normal;box-decoration-break:clone}
.ok{background:#e0f2e7;color:#205d39}
.part{background:#fff0c2;color:#735000}
.todo{background:#ffe3e3;color:#952828}
.caution{background:var(--hi);border:1px solid var(--line);font-size:.78rem;padding:0 4px}
details.toc{padding:4px 12px;margin:20px 0}
details.toc summary{padding:12px 28px 12px 0}
details.toc li{margin:8px 0}
details.toc a{display:inline-block;padding:3px 0}
.back-top{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:20;padding:11px 15px;background:var(--nav);color:#fff;border:1px solid var(--line);border-radius:24px;font-size:.85rem;text-decoration:none;box-shadow:0 3px 12px #0003}
a:focus-visible,summary:focus-visible,.tw:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
:target{scroll-margin-top:70px}
@media(min-width:700px){.game-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.game-body{padding:20px}h2{font-size:1.4rem}}
@media(prefers-color-scheme:dark){.ok{background:#213e2e;color:#b6e7c9}.part{background:#44391c;color:#f6d67b}.todo{background:#492629;color:#ffbaba}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tw').forEach(wrapper => {
    wrapper.tabIndex = 0;
    wrapper.setAttribute('role', 'region');
    wrapper.setAttribute('aria-label', '表格，可横向滚动');
  });
  function revealTarget() {
    let id;
    try { id = decodeURIComponent(location.hash.slice(1)); } catch { return; }
    const target = document.getElementById(id);
    if (!target) return;
    for (let parent = target; parent; parent = parent.parentElement) {
      if (parent.tagName === 'DETAILS') parent.open = true;
    }
    if (target.matches('.game')) target.querySelector('.game-panel').open = true;
    requestAnimationFrame(() => target.scrollIntoView({block: 'start'}));
  }
  window.addEventListener('hashchange', revealTarget);
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (link && link.hash === location.hash) revealTarget();
  });
  revealTarget();
});
</script>
</head>
<body id="top">
