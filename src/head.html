<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>俊伟的桌游规则手册</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f3;--fg:#252d31;--mut:#687277;--card:#fff;--line:#e2e7e4;--acc:#33736a;--acc2:#286d69;--hi:#eef5f1;--warn:#faf3e8;--nav:#203b38;--radius:12px}
@media(prefers-color-scheme:dark){:root{--bg:#141b1c;--fg:#e0e8e5;--mut:#a0b0ac;--card:#1c2627;--line:#344342;--acc:#8cc9b9;--acc2:#9bd5c7;--hi:#233a34;--warn:#332e23;--nav:#152b28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc2)}
main{max-width:900px;margin:auto;padding:20px 16px 32px;overflow-wrap:anywhere}
h1{font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.4;margin:6px 0 10px;letter-spacing:.02em}
h2{font-size:1.15rem;line-height:1.65;margin:0}
h3{font-size:1.05rem;line-height:1.65;margin:0;color:var(--acc2)}
h4{font-size:1rem;margin:1.5em 0 .6em}
p{margin:.85em 0}
ul,ol{padding-left:1.35em;margin:.85em 0}
li{margin:.5em 0}
li>ul,li>ol{margin:.4em 0;padding-left:1.1em}
.meta{color:var(--mut);font-size:.75rem;line-height:1.7}
.meta code{background:none;padding:0;font-size:inherit}
.game-card:hover{border-color:var(--acc)}
.warn,.hl{padding:12px;border-radius:var(--radius);margin:1em 0;background:var(--warn);border:1px solid var(--line)}
main>.warn{font-size:.75rem;color:var(--mut);line-height:1.8}
.hl{background:var(--hi);border-left:3px solid var(--acc)}
.game{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:24px 0;min-width:0}
.tw{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;margin:1em 0;border-radius:8px;-webkit-overflow-scrolling:touch}
.tw.data::before{content:'← 可左右滑动 →';display:block;position:sticky;left:0;width:fit-content;color:var(--mut);font-size:.7rem;padding:0 0 6px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem;line-height:1.8}
th,td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:var(--hi)}
code,.pat{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--hi);padding:0 4px;border-radius:4px;white-space:normal;overflow-wrap:anywhere}
pre{max-width:100%;overflow-x:auto;background:var(--hi);padding:12px;border-radius:8px;font-size:.9rem;line-height:1.65}
.badge,.ok,.part,.todo{display:inline-block;font-size:.72rem;line-height:1.65;font-weight:500;padding:2px 6px;border-radius:6px;margin:0 3px;white-space:normal}
.ok{background:#e0f2e7;color:#205d39}.part{background:#fff0c2;color:#735000}.todo{background:#ffe3e3;color:#952828}
h2 .badge{display:block;width:fit-content;margin:8px 0 0}
.caution{background:var(--hi);font-size:.78rem;padding:0 4px}
footer{color:var(--mut);font-size:.75rem;border-top:1px solid var(--line);margin-top:28px;padding-top:16px}
a:focus-visible,summary:focus-visible,.tw:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:559px){
 .kv table,.kv tbody{display:block;min-width:0;width:100%}
 .kv tr{display:block;border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:10px 12px}
 .kv th{display:block;border:0;background:none;padding:0;font-weight:500}
 .kv td{display:block;border:0;padding:0}
 .kv td:first-child{color:var(--acc2);font-size:.8rem;font-weight:600;margin-bottom:6px}
 .kv{overflow:visible}
}
@media(prefers-color-scheme:dark){.ok{background:#213e2e;color:#b6e7c9}.part{background:#44391c;color:#f6d67b}.todo{background:#492629;color:#ffbaba}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* App shell; the unenhanced document remains a fully expanded long page. */
[hidden]{display:none!important}
html{scroll-behavior:auto}
body{font-size:16px}
main{max-width:680px;padding:18px max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app-bar{height:calc(54px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;background:var(--bg);border-bottom:1px solid var(--line)}
.app-bar h1{font-size:17px;line-height:24px;margin:0;max-width:calc(100% - 164px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
#back{position:absolute;left:max(10px,env(safe-area-inset-left));min-height:44px;display:flex;align-items:center;padding:0 8px;text-decoration:none;font-size:16px}
.app .app-bar{position:fixed;inset:0 0 auto;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.app main{padding-top:calc(72px + env(safe-area-inset-top))}
.game-grid{display:block;margin:4px 0 20px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.game-card{display:flex;flex-direction:row;align-items:center;gap:10px;min-height:84px;border:0;border-radius:0;padding:16px;box-shadow:none;text-decoration:none;color:var(--fg);min-width:0}
.game-card+.game-card{border-top:1px solid var(--line)}
.game-card .card-copy{display:block;min-width:0;flex:1}
.game-card strong{display:block;font-size:17px}
.game-card .subtitle{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;margin-top:4px}
.game-card>.ok,.game-card>.part,.game-card>.todo{display:block;font-size:11px;flex:none;max-width:82px;margin:0;padding:3px 6px;border-radius:6px}
.game-card .chevron{font-size:24px;flex:none;color:var(--mut)}
.intro{font-size:12px;line-height:1.85;color:var(--mut);margin:12px 2px}
.game{padding:16px;margin:24px 0}
h2{font-size:24px;line-height:1.45}
h3{font-size:20px;margin:0 0 16px}
.app .game{margin:0;padding:0;border:0;background:none;display:flow-root}
.app .game>h2{margin:8px 0 12px}
.app .game>.meta{margin:0 0 20px}
.chapter{padding:18px 0;border:0;margin:0}
#chapter-tabs{position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:10;display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
/* The runtime tab bar follows the original game introduction. */
.app .game>h2{display:block}
.app .game>.meta{display:block}
#chapter-tabs{margin-bottom:8px}
button{font:inherit;color:var(--acc2);cursor:pointer;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
#chapter-tabs button{flex:none;font-size:14px;white-space:nowrap;border:0;background:none}
#chapter-tabs button[aria-selected="true"]{background:var(--hi);color:var(--acc2);font-weight:600}
#chapter-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
#chapter-count{font-size:12px;color:var(--mut)}
button:disabled{opacity:.38;cursor:default}
button:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.chapter a,.meta a{display:inline-block;min-height:44px;padding-top:8px;padding-bottom:8px}
@media(max-width:559px){.kv tr:first-child:has(th){display:none}}
.app .chapter:not([hidden]),.app #home:not([hidden]){animation:arrive .18s ease-out}
@keyframes arrive{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const games = [...document.querySelectorAll('.game')];
  const home = document.getElementById('home');
  const title = document.getElementById('app-title');
  const back = document.getElementById('back');
  const tabs = document.getElementById('chapter-tabs');
  const pager = document.getElementById('chapter-pager');
  const previous = document.getElementById('previous');
  const next = document.getElementById('next');
  let active, chapters = [], selected = 0;
  const routeFor = (game, chapter) => '#/g/' + game.id + (chapter ? '/' + chapter.dataset.chapter : '');
  document.querySelectorAll('.game-card').forEach(link => link.href = '#' + link.dataset.route);
  document.querySelectorAll('.tw.data').forEach(wrapper => {
    wrapper.tabIndex = 0;
    wrapper.setAttribute('role', 'region');
    wrapper.setAttribute('aria-label', '表格，可横向滚动');
  });
  function selectChapter(index, focus = false) {
    selected = Math.max(0, Math.min(index, chapters.length - 1));
    chapters.forEach((chapter, i) => chapter.hidden = i !== selected);
    [...tabs.children].forEach((tab, i) => {
      tab.setAttribute('aria-selected', String(i === selected));
      tab.tabIndex = i === selected ? 0 : -1;
      if (i === selected) {
        tabs.scrollLeft = tab.offsetLeft - tabs.offsetLeft - (tabs.clientWidth - tab.clientWidth) / 2;
        if (focus) tab.focus({preventScroll:true});
      }
    });
    previous.disabled = selected === 0;
    next.disabled = selected === chapters.length - 1;
    document.getElementById('chapter-count').textContent = `${selected + 1} / ${chapters.length}`;
    window.scrollTo({top:0, behavior:'instant'});
  }
  function changeChapter(index, focus = false) {
    if (!active || index < 0 || index >= chapters.length) return;
    // Chapters replace the current entry so browser Back returns to the home list.
    history.replaceState(null, '', routeFor(active, chapters[index]));
    selectChapter(index, focus);
  }
  function render() {
    let hash;
    try { hash = decodeURIComponent(location.hash.slice(1)); } catch { hash = ''; }
    const parts = hash.split('/');
    let game, chapter;
    if (parts[1] === 'g') {
      game = games.find(item => item.id === parts[2]);
      chapter = game && [...game.querySelectorAll('.chapter')].find(item => item.dataset.chapter === parts[3]);
    } else {
      const target = document.getElementById(hash);
      game = target && target.closest('.game');
      chapter = target && target.closest('.chapter');
    }
    active = game;
    home.hidden = !!game;
    back.hidden = !game;
    tabs.hidden = !game;
    pager.hidden = !game;
    title.textContent = game ? game.dataset.short : '桌游规则';
    document.title = game ? game.dataset.short + ' · 桌游规则' : '桌游规则';
    games.forEach(item => item.hidden = item !== game);
    tabs.replaceChildren();
    if (game) {
      chapters = [...game.querySelectorAll('.chapter')];
      game.insertBefore(tabs, chapters[0]);
      tabs.setAttribute('role', 'tablist');
      chapters.forEach((item, i) => {
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = item.querySelector('h3').textContent;
        button.id = 'tab-' + item.dataset.chapter;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-controls', 'panel-' + item.dataset.chapter);
        item.id = 'panel-' + item.dataset.chapter;
        item.setAttribute('role', 'tabpanel');
        item.setAttribute('aria-labelledby', button.id);
        button.addEventListener('click', () => changeChapter(i));
        button.addEventListener('keydown', event => {
          const index = event.key === 'ArrowRight' ? (i + 1) % chapters.length : event.key === 'ArrowLeft' ? (i - 1 + chapters.length) % chapters.length : event.key === 'Home' ? 0 : event.key === 'End' ? chapters.length - 1 : -1;
          if (index >= 0) { event.preventDefault(); changeChapter(index, true); }
        });
        tabs.append(button);
      });
      game.querySelectorAll('details').forEach(item => item.open = true);
      selectChapter(chapter ? chapters.indexOf(chapter) : 0);
    }
    window.scrollTo({top:0, behavior:'instant'});
    title.focus({preventScroll:true});
  }
  previous.addEventListener('click', () => changeChapter(selected - 1));
  next.addEventListener('click', () => changeChapter(selected + 1));
  let touch;
  document.addEventListener('touchstart', event => {
    touch = null;
    if (!active || event.touches.length !== 1 || !event.target.closest('.chapter') || event.target.closest('.tw, pre, a, button, input, summary')) return;
    const point = event.touches[0];
    if (point.clientX < 28 || point.clientX > innerWidth - 28) return;
    touch = {x:point.clientX, y:point.clientY};
  }, {passive:true});
  document.addEventListener('touchend', event => {
    if (!touch) return;
    const dx = event.changedTouches[0].clientX - touch.x;
    const dy = event.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) changeChapter(selected + (dx < 0 ? 1 : -1));
  }, {passive:true});
  document.addEventListener('touchcancel', () => touch = null, {passive:true});
  window.addEventListener('hashchange', render);
  document.addEventListener('click', event => {
    const link = event.target.closest('a[href^="#"]');
    if (link && link.hash === location.hash) { event.preventDefault(); render(); }
  });
  document.documentElement.classList.add('app');
  render();
});
</script>
</head>
<body id="top">
